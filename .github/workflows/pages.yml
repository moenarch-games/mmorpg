name: Pages

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - "web/**"
      - "fixtures/protocol/**"
      - "crates/mmorpg-core/**"
      - "crates/mmorpg-protocol/**"
      - "crates/mmorpg-wasm/**"
      - "crates/mmorpg-scenery/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "scripts/smoke-browser.py"
      - ".github/workflows/pages.yml"
  push:
    branches:
      - main
    paths:
      - "web/**"
      - "fixtures/protocol/**"
      - "crates/mmorpg-core/**"
      - "crates/mmorpg-protocol/**"
      - "crates/mmorpg-wasm/**"
      - "crates/mmorpg-scenery/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "scripts/smoke-browser.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.event.action != 'labeled' || github.event.label.name == 'browser-evidence'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Must equal the exact wasm-bindgen pin in crates/mmorpg-wasm/Cargo.toml;
      # web/scripts/build-wasm.ts fails the build on any mismatch.
      WASM_BINDGEN_VERSION: "0.2.129"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Rust toolchain and wasm32 target from rust-toolchain.toml
        run: |
          rustup toolchain install
          rustup target list --installed | grep -qx wasm32-unknown-unknown
      - name: Cache Cargo
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-pages-cargo-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-pages-cargo-
      - name: Cache wasm-bindgen CLI
        id: wasm-bindgen-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cargo/bin/wasm-bindgen
          key: ${{ runner.os }}-wasm-bindgen-cli-${{ env.WASM_BINDGEN_VERSION }}-${{ hashFiles('rust-toolchain.toml') }}
      - name: Install pinned wasm-bindgen CLI
        if: steps.wasm-bindgen-cache.outputs.cache-hit != 'true'
        run: cargo install wasm-bindgen-cli --version "=${WASM_BINDGEN_VERSION}" --locked
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"
      - name: Install web dependencies
        working-directory: web
        run: bun install --frozen-lockfile
      - name: Check out the pinned saved-mask producer
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: moritzbrantner/asset-tooling
          ref: 1e79d74ee0a62cd29706ed3254a0293c91d996ba
          path: artifacts/asset-tooling-mask-source
          persist-credentials: false
      - name: Reproduce the accepted Greyhaven grass package
        run: bun web/scripts/package-grass.ts artifacts/asset-tooling-mask-source --check
      - name: Reproduce the authored Greyhaven relief package
        run: bun web/scripts/package-relief.ts artifacts/asset-tooling-mask-source --check
      - name: Typecheck the asset authoring adapter
        working-directory: web
        run: bunx --no-install tsc --noEmit -p tsconfig.assets.json
      - name: Test browser contracts and the WASM local zone host
        working-directory: web
        env:
          ASSET_TOOLING_MASK_SOURCE: ${{ github.workspace }}/artifacts/asset-tooling-mask-source
        run: bun test
      - name: Build tech demo with the WASM local zone host
        working-directory: web
        run: bun run build
      - name: Install browser acceptance tooling
        if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'browser-evidence')
        run: |
          python3 -m pip install playwright==1.57.0
          python3 -m playwright install --with-deps chromium
      - name: Exercise production browser demo
        if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'browser-evidence')
        run: python3 scripts/smoke-browser.py
      - name: Retain browser screenshots and evidence
        if: always() && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'browser-evidence'))
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-evidence
          path: artifacts/browser/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        if: github.event_name != 'pull_request'
        with:
          path: web/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
