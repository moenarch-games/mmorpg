name: Validate

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  merge_group:
    types: [checks_requested]
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      full_validation:
        description: Run comprehensive tests, Clippy and WASM checks
        type: boolean
        default: false

jobs:
  scope:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      pages-validation: ${{ steps.pages-scope.outputs.pages-validation }}
      allow-skipped: ${{ steps.pages-scope.outputs.allow-skipped }}
      clippy: ${{ steps.pages-scope.outputs.clippy }}
      work-contract: ${{ steps.pages-scope.outputs.work-contract }}
      runtime-budgets: ${{ steps.pages-scope.outputs.runtime-budgets }}
      studio-frontend: ${{ steps.pages-scope.outputs.studio-frontend }}
      docs_only: ${{ steps.detect.outputs.docs_only }}
      rust_changed: ${{ steps.detect.outputs.rust_changed }}
      settings_only: ${{ steps.detect.outputs.settings_only }}
      full_validation: ${{ steps.detect.outputs.full_validation }}
      browser_evidence: ${{ steps.detect.outputs.browser_evidence }}
      asset_cache_key: ${{ steps.assets.outputs.key }}
      asset_cache_paths: ${{ steps.assets.outputs.paths }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify PR changes
        id: detect
        shell: bash
        env:
          FULL_VALIDATION: ${{ inputs.full_validation == true }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          PR_HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
        run: |
          set -euo pipefail
          browser_evidence=false
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            # A rerun's event payload can predate the owner's current validation labels.
            flags="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '[any(.labels[]; .name == "full-validation"), any(.labels[]; .name == "browser-evidence")] | @tsv')"
            read -r FULL_VALIDATION browser_evidence <<< "$flags"
            if [[ ! "$FULL_VALIDATION" =~ ^(true|false)$ || ! "$browser_evidence" =~ ^(true|false)$ ]]; then
              echo "Unable to determine the current validation labels" >&2
              exit 1
            fi
          fi
          printf 'browser_evidence=%s\n' "$browser_evidence" >> "$GITHUB_OUTPUT"
          printf 'full_validation=%s\n' "$FULL_VALIDATION" >> "$GITHUB_OUTPUT"
          docs_only=false
          rust_changed=true
          settings_only=false
          catalog_changed=false
          if [[ -n "$PR_BASE" && -n "$PR_HEAD" ]] &&
            git cat-file -e "$PR_BASE^{commit}" &&
            git cat-file -e "$PR_HEAD^{commit}" &&
            git diff --no-renames --name-only -z "$PR_BASE" "$PR_HEAD" > "$RUNNER_TEMP/changed-files";
          then
            mapfile -d '' -t files < "$RUNNER_TEMP/changed-files"
            if (( ${#files[@]} > 0 )); then
              docs_only=true
              rust_changed=false
              settings_only=true
              for file in "${files[@]}"; do
                case "$file" in
                  docs/*.md|README.md|AGENTS.md|CLAUDE.md|ROADMAP.md|DESIGN.md|SCENARIO_EXPERIMENTS.md) ;;
                  *) docs_only=false ;;
                esac
                case "$file" in
                  Cargo.toml|Cargo.lock|rust-toolchain*|.cargo/*|crates/*|content/*|web/assets/*) rust_changed=true ;;
                  # Tracked files outside the crates that the Rust build and tests read (#1099):
                  # golden fixtures, authored art and effects, review poses, the bundle fetch and
                  # CI installers, and the lint, test-runner and work-contract configuration. The
                  # shared input action catalog is content/settings/input-actions.json (#1284).
                  fixtures/*|web/public/*) rust_changed=true ;;
                  scripts/review-poses.json|scripts/fetch-bundles.sh|scripts/ci-*) rust_changed=true ;;
                  .config/*|clippy.toml|.performance/*) rust_changed=true ;;
                esac
                # Settings catalog changes affect the native client, but do not require the
                # unrelated long-running zone journeys on an ordinary PR. Merge queue runs
                # retain the complete Rust suite before integration.
                case "$file" in
                  web/assets/*|web/public/*) settings_only=false ;;
                  content/settings/catalog.json) catalog_changed=true ;;
                  web/*) ;;
                  *) settings_only=false ;;
                esac
              done
            fi
          fi
          # The merge queue fast-forwards main to the exact commit its merge_group run validated, so
          # the push run for that commit would repeat the same Rust validation. A push that changes
          # the Cargo cache key still runs it: main's run seeds the shared Cargo cache that later PR
          # and merge_group runs restore.
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$rust_changed" == "true" && -f "$RUNNER_TEMP/changed-files" ]]; then
            queued="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/validate.yml/runs?event=merge_group&head_sha=${GITHUB_SHA}&status=success" --jq '.total_count')"
            if (( queued > 0 )) && ! grep -qzE '^(Cargo\.toml|Cargo\.lock|rust-toolchain.*|\.cargo/.*|crates/[^/]+/Cargo\.toml)$' "$RUNNER_TEMP/changed-files"; then
              echo "merge_group already validated ${GITHUB_SHA}; skipping the repeated Rust validation"
              rust_changed=false
            fi
          fi
          printf 'docs_only=%s\n' "$docs_only" >> "$GITHUB_OUTPUT"
          printf 'rust_changed=%s\n' "$rust_changed" >> "$GITHUB_OUTPUT"
          # The settings shortcut stands for a settings catalog change only (#1163).
          if [[ "$GITHUB_EVENT_NAME" != "pull_request" || "$rust_changed" != "true" || "$catalog_changed" != "true" || "$FULL_VALIDATION" == "true" ]]; then
            settings_only=false
          fi
          printf 'settings_only=%s\n' "$settings_only" >> "$GITHUB_OUTPUT"

      - name: Validate the work-complexity contract's structure
        # A change to .performance/ must leave the contract valid (#1132): an invalid entry makes
        # the whole contract unverifiable. Structure only, no builds, so it also covers changes the
        # work-contract job skips. Without a known change list the check runs.
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ -f "$RUNNER_TEMP/changed-files" ]] && ! grep -qz '^\.performance/' "$RUNNER_TEMP/changed-files"; then
            echo "The work-complexity contract did not change."
            exit 0
          fi
          scripts/ci-install-bun.sh
          export PATH="$HOME/.bun/bin:$PATH"
          scripts/ci-work-contract.sh structure

      - name: Test the Blender layout export
        # Plain Python, no Blender (#1163). Without a known change list the test runs.
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f "$RUNNER_TEMP/changed-files" ]] && ! grep -qz '^scripts/blender/' "$RUNNER_TEMP/changed-files"; then
            echo "The Blender layout export did not change."
            exit 0
          fi
          cd scripts/blender && python3 -m unittest test_greyhaven_layout

      - name: Resolve the asset cache identity
        id: assets
        if: github.event_name == 'push' || steps.detect.outputs.rust_changed == 'true' || steps.detect.outputs.full_validation == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci-asset-cache.sh

      - id: pages-scope
        name: Preserve browser validation scope
        shell: python
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
          PR_EVENT: ${{ toJSON(github.event) }}
          RUST_CHANGED: ${{ steps.detect.outputs.rust_changed }}
          DOCS_ONLY: ${{ steps.detect.outputs.docs_only }}
          FULL_VALIDATION: ${{ steps.detect.outputs.full_validation }}
        run: |
          import json
          import os
          import re
          import subprocess

          # Preserve GitHub path-filter semantics, including both paths of a rename.
          def matches(path, pattern):
              parts = re.split(r"(\*\*/|\*\*|\*|\?)", pattern)
              expression = "".join({"**/": "(?:.*/)?", "**": ".*", "*": "[^/]*", "?": "[^/]"}.get(part, re.escape(part)) for part in parts)
              return re.fullmatch(expression, path) is not None

          def included(value, patterns):
              selected = False
              for pattern in patterns:
                  negative = pattern.startswith("!")
                  if matches(value, pattern[1:] if negative else pattern):
                      selected = not negative
              return selected

          specs = {'studio-frontend': {'paths': ['crates/mmorpg-world-studio/frontend/**', '.github/workflows/validate.yml']}, 'pages-validation': {'types': ['opened', 'synchronize', 'reopened', 'labeled', 'unlabeled'], 'paths': ['web/**', 'content/**', 'fixtures/protocol/session-frames-v3.hex', 'fixtures/scenery/**', 'crates/mmorpg-core/**', 'crates/mmorpg-protocol/**', 'crates/mmorpg-wasm/**', 'crates/mmorpg-local-host/**', 'crates/mmorpg-control-plane/**', 'crates/mmorpg-scenery/**', 'crates/sim-foundation/**', 'crates/sim-movement/**', 'crates/sim-combat/**', 'crates/mmorpg-presentation/**', 'crates/mmorpg-client-model/**', 'crates/mmorpg-characters/**','Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', 'scripts/smoke-browser.py', '.github/workflows/pages.yml']}}
          pr = os.environ["GITHUB_EVENT_NAME"] in ("pull_request", "merge_group")
          event = json.loads(os.environ.get("PR_EVENT", "{}"))
          paths = []
          if pr:
              raw = subprocess.check_output(["git", "diff", "--no-renames", "--name-only", "-z", os.environ["BASE_SHA"] + "..." + os.environ["HEAD_SHA"]])
              paths = [path for path in raw.decode().split("\0") if path]
          selected = {}
          for job, spec in specs.items():
              active = pr
              if active and event.get("action") in ["labeled", "unlabeled"]:
                  active = event.get("label", {}).get("name") in ["browser-evidence", "full-validation"]
              if active and spec.get("branches"):
                  active = included(event["pull_request"]["base"]["ref"], spec["branches"])
              if active and spec.get("branches-ignore"):
                  active = not included(event["pull_request"]["base"]["ref"], spec["branches-ignore"])
              if active and paths and spec.get("paths"):
                  active = any(included(path, spec["paths"]) for path in paths)
              if active and paths and spec.get("paths-ignore"):
                  active = any(not included(path, spec["paths-ignore"]) for path in paths)
              # An empty comparison is not evidence that a required validation is out of scope.
              selected[job] = active
          # Clippy is enforced at merge time only: PRs stay opt-in (full-validation), the merge queue always lints Rust changes.
          selected["clippy"] = os.environ["GITHUB_EVENT_NAME"] == "merge_group" and os.environ.get("RUST_CHANGED") == "true"
          # The work-complexity contract and the runtime budgets run on every PR and merge-queue run that changes Rust or
          # browser code, and under full validation (owner decision 2026-11-27, #1256); docs-only changes skip them.
          # An unknown change list counts as a code change. A label other than the validation labels re-runs nothing.
          relabelled = event.get("action") in ["labeled", "unlabeled"] and event.get("label", {}).get("name") not in ["browser-evidence", "full-validation"]
          code = os.environ.get("RUST_CHANGED") == "true" or not paths or any(
              path.startswith("web/") or path in ["scripts/runtime_budget.py", "scripts/operation-work.py"] for path in paths)
          selected["work-contract"] = os.environ.get("FULL_VALIDATION") == "true" or (pr and code and not relabelled)
          # Main's pushes record the runtime baseline the next PR and merge-queue runs warn against.
          selected["runtime-budgets"] = selected["work-contract"] or (os.environ["GITHUB_EVENT_NAME"] == "push" and os.environ.get("DOCS_ONLY") != "true")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              for job, active in selected.items():
                  print(f"{job}={str(active).lower()}", file=output)
              print("allow-skipped=" + json.dumps([job for job, active in selected.items() if not active]), file=output)

  rust:
    # The native client's gamepad backend (gilrs) links libudev, so every Rust job installs its headers;
    # its build embeds the asset-tooling Ranger bundle, which the fetch script downloads first.
    needs: scope
    permissions:
      contents: read
      packages: read
    uses: moritzbrantner/reusable-workflows/.github/workflows/validate-repo.yml@858803b5ce092c1bc9981f215ceab43066bc1ca8
    with:
      # Tests plus `cargo check` exceed the reusable job's 45-minute default when several PRs
      # validate at once (2026-11-21: five queue/PR runs cancelled at exactly 45 minutes).
      timeout_minutes: 75
      # Bun comes from scripts/ci-install-bun.sh, which retries; the reusable job's setup step cannot.
      # The wasm-bindgen CLI is for web/'s `@moritzbrantner/maps` prepare script, which the reference
      # tests' `bun install` runs (#896).
      # The reusable job holds this run's github.token in NODE_AUTH_TOKEN; these commands export it
      # as GH_TOKEN so release downloads are authenticated. Only the variable name is interpolated.
      bun_version: ""
      node_version: ""
      install_command: ${{ needs.scope.outputs.full_validation == 'true' && 'export GH_TOKEN="$NODE_AUTH_TOKEN" && scripts/ci-install-bun.sh && scripts/ci-install-wasm-bindgen.sh && export PATH="$HOME/.bun/bin:$PATH" && cd web && bun install --frozen-lockfile' || (needs.scope.outputs.rust_changed == 'true' && 'export GH_TOKEN="$NODE_AUTH_TOKEN" && scripts/ci-install-bun.sh && scripts/ci-install-wasm-bindgen.sh' || '') }}
      cache_bun: false
      # Once per job: libudev headers, the asset bundles and cargo-nextest (tests run per process, in parallel).
      apt_packages: ${{ (needs.scope.outputs.rust_changed == 'true' || needs.scope.outputs.full_validation == 'true') && 'libudev-dev libasound2-dev' || '' }}
      pre_validate_command: ${{ (needs.scope.outputs.rust_changed == 'true' || needs.scope.outputs.full_validation == 'true') && (needs.scope.outputs.settings_only == 'true' && 'export GH_TOKEN="$NODE_AUTH_TOKEN" && scripts/fetch-bundles.sh' || 'export GH_TOKEN="$NODE_AUTH_TOKEN" && scripts/fetch-bundles.sh && scripts/ci-install-nextest.sh') || '' }}
      cache_cargo: ${{ needs.scope.outputs.rust_changed == 'true' || needs.scope.outputs.full_validation == 'true' }}
      # A push to main resolves the key for seed-asset-cache even when this job has nothing to do.
      cache_paths: ${{ needs.scope.outputs.asset_cache_paths }}
      cache_key: ${{ (needs.scope.outputs.rust_changed == 'true' || needs.scope.outputs.full_validation == 'true') && needs.scope.outputs.asset_cache_key || '' }}
      cache_restore_keys: mmorpg-assets-
      format_command: ${{ (needs.scope.outputs.rust_changed == 'true' || needs.scope.outputs.full_validation == 'true') && 'cargo fmt --all -- --check' || '' }}
      lint_command: ${{ needs.scope.outputs.full_validation == 'true' && 'cargo clippy --workspace --all-targets --all-features --locked -- -D warnings && (cd web && bunx --no-install tsc --noEmit -p tsconfig.assets.json)' || '' }}
      # Ordinary Rust PRs run the workspace tests too. GPU tests are #[ignore]d; the native/Pages
      # reference tests install web/ with Bun and build the WASM page themselves (#896).
      # Ordinary runs test the production configuration: Physics Engine only, without the
      # `physics-ab` feature that compiles Rapier (owner decision 2026-11-23, #1117). The
      # Rapier A/B comparison runs under full validation's --all-features. The workloads and the
      # bot scenarios are one trial each and the long journeys start first
      # (.config/nextest.toml, #540).
      test_command: ${{ needs.scope.outputs.full_validation == 'true' && 'python3 scripts/test-dev-native.py && cargo nextest run --workspace --all-features --locked' || (needs.scope.outputs.settings_only == 'true' && 'cargo test -p mmorpg-client --lib settings::tests --locked' || (needs.scope.outputs.rust_changed == 'true' && 'cargo nextest run --workspace --locked' || '')) }}
      # Full validation builds only the WASM target here: Clippy (--all-targets --all-features) and
      # nextest (--all-features) already compile and link every native target, and a separate dev
      # `cargo build --workspace --all-features` shared no artifacts with either (#1087). Ordinary
      # runs keep `cargo check`.
      build_command: ${{ (needs.scope.outputs.rust_changed == 'true' || needs.scope.outputs.full_validation == 'true') && (needs.scope.outputs.full_validation == 'true' && 'cargo build -p mmorpg-core -p mmorpg-protocol -p mmorpg-wasm --target wasm32-unknown-unknown --locked' || (needs.scope.outputs.settings_only == 'true' && 'cargo check -p mmorpg-client --locked' || 'cargo check --workspace --locked')) || '' }}

  clippy:
    # Runs beside `rust` in the merge queue only and shares its Cargo cache (same reusable job).
    needs: scope
    if: needs.scope.outputs.clippy == 'true'
    permissions:
      contents: read
      packages: read
    uses: moritzbrantner/reusable-workflows/.github/workflows/validate-repo.yml@858803b5ce092c1bc9981f215ceab43066bc1ca8
    with:
      bun_version: ""
      node_version: ""
      install_command: export GH_TOKEN="$NODE_AUTH_TOKEN" && scripts/ci-install-bun.sh
      cache_bun: false
      apt_packages: libudev-dev libasound2-dev
      pre_validate_command: export GH_TOKEN="$NODE_AUTH_TOKEN" && scripts/fetch-bundles.sh
      cache_cargo: true
      cache_paths: ${{ needs.scope.outputs.asset_cache_paths }}
      cache_key: ${{ needs.scope.outputs.asset_cache_key }}
      cache_restore_keys: mmorpg-assets-
      lint_command: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      artifact_name_suffix: -clippy
      # The default group is shared with `rust` in this run and would cancel it.
      concurrency_group: ${{ github.workflow }}-${{ github.ref }}-clippy

  work-contract:
    # The work-complexity contract (.performance/contract.json, #1120) against deterministic counters
    # from the Rust work examples and the browser measurements (web/scripts/work-evidence.ts), on every
    # PR and merge-queue run that changes Rust or browser code and under full validation (#1256).
    needs: scope
    if: needs.scope.outputs.work-contract == 'true'
    permissions:
      contents: read
      packages: read
    uses: moritzbrantner/reusable-workflows/.github/workflows/validate-repo.yml@858803b5ce092c1bc9981f215ceab43066bc1ca8
    with:
      bun_version: ""
      node_version: ""
      install_command: export GH_TOKEN="$NODE_AUTH_TOKEN" && scripts/ci-install-bun.sh && scripts/ci-install-wasm-bindgen.sh && export PATH="$HOME/.bun/bin:$PATH" && cd web && bun install --frozen-lockfile
      cache_bun: false
      pre_validate_command: export GH_TOKEN="$NODE_AUTH_TOKEN" && scripts/fetch-bundles.sh
      cache_cargo: true
      cache_paths: ${{ needs.scope.outputs.asset_cache_paths }}
      cache_key: ${{ needs.scope.outputs.asset_cache_key }}
      cache_restore_keys: mmorpg-assets-
      test_command: scripts/ci-work-contract.sh
      artifact_name_suffix: -work-contract
      # The default group is shared with `rust` in this run and would cancel it.
      concurrency_group: ${{ github.workflow }}-${{ github.ref }}-work-contract

  runtime-budgets:
    # Wall-clock runtime of the native zone scenarios (.performance/runtime.json, #1256) on the hosted
    # runner: a ceiling crossed fails, a regression against main's latest baseline only warns. Runs where
    # the work contract does; main's pushes measure the baseline (a cache entry per commit). The browser
    # frame budgets need a GPU and run through scripts/profile-browser.py --budgets instead.
    needs: scope
    if: needs.scope.outputs.runtime-budgets == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-runtime-budgets
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - name: Cache Cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: runtime-budgets
      - name: Restore main's runtime baseline
        if: github.event_name != 'push'
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: artifacts/runtime-baseline/native.json
          key: runtime-baseline-${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.sha }}
          restore-keys: runtime-baseline-
      - name: Check the native runtime budgets
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            python3 scripts/runtime_budget.py native --out artifacts/runtime-baseline/native.json
          else
            python3 scripts/runtime_budget.py native --baseline artifacts/runtime-baseline/native.json --out artifacts/runtime/native.json
          fi
      - name: Record the runtime baseline
        if: github.event_name == 'push'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: artifacts/runtime-baseline/native.json
          key: runtime-baseline-${{ github.sha }}

  seed-asset-cache:
    # Pull-request and merge-queue caches are scoped to their own ref; only main's cache reaches
    # every run. Not part of merge-ready: a run that misses the cache still fetches the bundles.
    needs: scope
    if: github.event_name == 'push' && needs.scope.outputs.asset_cache_key != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Restore the asset bundles
        id: restore
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ needs.scope.outputs.asset_cache_paths }}
          key: ${{ needs.scope.outputs.asset_cache_key }}
          restore-keys: mmorpg-assets-
      - name: Fetch the releases that moved
        if: steps.restore.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/fetch-bundles.sh

  studio-frontend:
    # World Studio's frontend has no tests; its build runs where its inputs change (#1163).
    needs: scope
    if: needs.scope.outputs.studio-frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      # The `@moritzbrantner/maps` git dependency builds its WASM package when it is installed.
      - name: Install Rust toolchain and wasm32 target from rust-toolchain.toml
        run: |
          rustup toolchain install
          rustup target list --installed | grep -qx wasm32-unknown-unknown
      - name: Install wasm-bindgen and Bun
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci-install-wasm-bindgen.sh && scripts/ci-install-bun.sh
      - name: Build the World Studio frontend
        working-directory: crates/mmorpg-world-studio/frontend
        run: |
          export PATH="$HOME/.bun/bin:$HOME/.cargo/bin:$PATH"
          bun install --frozen-lockfile
          bun run build

  pages-validation:
    needs: scope
    if: needs.scope.outputs.pages-validation == 'true'
    uses: ./.github/workflows/pages.yml
    with:
      full_validation: ${{ needs.scope.outputs.full_validation == 'true' }}
      browser_evidence: ${{ needs.scope.outputs.browser_evidence == 'true' }}
    secrets: inherit
    permissions:
      contents: read
      pages: write
      id-token: write

  merge-ready:
    name: >-
      ${{ (github.event_name == 'merge_group' || (github.event_name == 'pull_request' &&
      ((github.event.action != 'labeled' && github.event.action != 'unlabeled') ||
      github.event.label.name == 'browser-evidence' || github.event.label.name == 'full-validation'))) &&
      'merge-ready' || 'validation-summary' }}
    if: ${{ always() }}
    needs: [scope, rust, clippy, work-contract, runtime-budgets, studio-frontend, pages-validation]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: moritzbrantner/reusable-workflows/.github/actions/merge-ready@858803b5ce092c1bc9981f215ceab43066bc1ca8
        with:
          needs: ${{ toJSON(needs) }}
          required: '["scope", "rust", "clippy", "work-contract", "runtime-budgets", "studio-frontend", "pages-validation"]'
          allow-skipped: ${{ needs.scope.outputs.allow-skipped || '[]' }}
