name: Validate

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  merge_group:
    types: [checks_requested]
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      full_validation:
        description: Run comprehensive tests, Clippy and WASM checks
        type: boolean
        default: false

jobs:
  scope:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      pages-validation: ${{ steps.pages-scope.outputs.pages-validation }}
      allow-skipped: ${{ steps.pages-scope.outputs.allow-skipped }}
      docs_only: ${{ steps.detect.outputs.docs_only }}
      rust_changed: ${{ steps.detect.outputs.rust_changed }}
      full_validation: ${{ steps.detect.outputs.full_validation }}
      browser_evidence: ${{ steps.detect.outputs.browser_evidence }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify PR changes
        id: detect
        shell: bash
        env:
          FULL_VALIDATION: ${{ inputs.full_validation == true }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          PR_HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
        run: |
          set -euo pipefail
          browser_evidence=false
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            # A rerun's event payload can predate the owner's current validation labels.
            flags="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '[any(.labels[]; .name == "full-validation"), any(.labels[]; .name == "browser-evidence")] | @tsv')"
            read -r FULL_VALIDATION browser_evidence <<< "$flags"
            if [[ ! "$FULL_VALIDATION" =~ ^(true|false)$ || ! "$browser_evidence" =~ ^(true|false)$ ]]; then
              echo "Unable to determine the current validation labels" >&2
              exit 1
            fi
          fi
          printf 'browser_evidence=%s\n' "$browser_evidence" >> "$GITHUB_OUTPUT"
          printf 'full_validation=%s\n' "$FULL_VALIDATION" >> "$GITHUB_OUTPUT"
          docs_only=false
          rust_changed=true
          if [[ -n "$PR_BASE" && -n "$PR_HEAD" ]] &&
            git cat-file -e "$PR_BASE^{commit}" &&
            git cat-file -e "$PR_HEAD^{commit}" &&
            git diff --no-renames --name-only -z "$PR_BASE" "$PR_HEAD" > "$RUNNER_TEMP/changed-files";
          then
            mapfile -d '' -t files < "$RUNNER_TEMP/changed-files"
            if (( ${#files[@]} > 0 )); then
              docs_only=true
              rust_changed=false
              for file in "${files[@]}"; do
                case "$file" in
                  docs/*.md|README.md|AGENTS.md|CLAUDE.md|ROADMAP.md|DESIGN.md|SCENARIO_EXPERIMENTS.md) ;;
                  *) docs_only=false ;;
                esac
                case "$file" in
                  Cargo.toml|Cargo.lock|rust-toolchain*|.cargo/*|crates/*|content/*|web/assets/*) rust_changed=true ;;
                esac
              done
            fi
          fi
          # The merge queue fast-forwards main to the exact commit its merge_group run validated, so
          # the push run for that commit would repeat the same Rust validation. A push that changes
          # the Cargo cache key still runs it: main's run seeds the shared Cargo cache that later PR
          # and merge_group runs restore.
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$rust_changed" == "true" && -f "$RUNNER_TEMP/changed-files" ]]; then
            queued="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/validate.yml/runs?event=merge_group&head_sha=${GITHUB_SHA}&status=success" --jq '.total_count')"
            if (( queued > 0 )) && ! grep -qzE '^(Cargo\.toml|Cargo\.lock|rust-toolchain.*|\.cargo/.*|crates/[^/]+/Cargo\.toml)$' "$RUNNER_TEMP/changed-files"; then
              echo "merge_group already validated ${GITHUB_SHA}; skipping the repeated Rust validation"
              rust_changed=false
            fi
          fi
          printf 'docs_only=%s\n' "$docs_only" >> "$GITHUB_OUTPUT"
          printf 'rust_changed=%s\n' "$rust_changed" >> "$GITHUB_OUTPUT"

      - id: pages-scope
        name: Preserve browser validation scope
        shell: python
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
          PR_EVENT: ${{ toJSON(github.event) }}
        run: |
          import json
          import os
          import re
          import subprocess

          # Preserve GitHub path-filter semantics, including both paths of a rename.
          def matches(path, pattern):
              parts = re.split(r"(\*\*/|\*\*|\*|\?)", pattern)
              expression = "".join({"**/": "(?:.*/)?", "**": ".*", "*": "[^/]*", "?": "[^/]"}.get(part, re.escape(part)) for part in parts)
              return re.fullmatch(expression, path) is not None

          def included(value, patterns):
              selected = False
              for pattern in patterns:
                  negative = pattern.startswith("!")
                  if matches(value, pattern[1:] if negative else pattern):
                      selected = not negative
              return selected

          specs = {'pages-validation': {'types': ['opened', 'synchronize', 'reopened', 'labeled', 'unlabeled'], 'paths': ['web/**', 'content/**', 'fixtures/protocol/**', 'crates/mmorpg-core/**', 'crates/mmorpg-protocol/**', 'crates/mmorpg-wasm/**', 'crates/mmorpg-scenery/**', 'Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', 'scripts/smoke-browser.py', '.github/workflows/pages.yml']}}
          pr = os.environ["GITHUB_EVENT_NAME"] in ("pull_request", "merge_group")
          event = json.loads(os.environ.get("PR_EVENT", "{}"))
          paths = []
          if pr:
              raw = subprocess.check_output(["git", "diff", "--no-renames", "--name-only", "-z", os.environ["BASE_SHA"] + "..." + os.environ["HEAD_SHA"]])
              paths = [path for path in raw.decode().split("\0") if path]
          selected = {}
          for job, spec in specs.items():
              active = pr
              if active and event.get("action") in ["labeled", "unlabeled"]:
                  active = event.get("label", {}).get("name") in ["browser-evidence", "full-validation"]
              if active and spec.get("branches"):
                  active = included(event["pull_request"]["base"]["ref"], spec["branches"])
              if active and spec.get("branches-ignore"):
                  active = not included(event["pull_request"]["base"]["ref"], spec["branches-ignore"])
              if active and paths and spec.get("paths"):
                  active = any(included(path, spec["paths"]) for path in paths)
              if active and paths and spec.get("paths-ignore"):
                  active = any(not included(path, spec["paths-ignore"]) for path in paths)
              # An empty comparison is not evidence that a required validation is out of scope.
              selected[job] = active
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              for job, active in selected.items():
                  print(f"{job}={str(active).lower()}", file=output)
              print("allow-skipped=" + json.dumps([job for job, active in selected.items() if not active]), file=output)

  rust:
    # The native client's gamepad backend (gilrs) links libudev, so every Rust job installs its headers;
    # its build embeds the asset-tooling Ranger bundle, which the fetch script downloads first.
    needs: scope
    permissions:
      contents: read
      packages: read
    uses: moritzbrantner/reusable-workflows/.github/workflows/validate-repo.yml@2ec8d067031d4e9d093701f23a00b0ddcaef42d8
    with:
      bun_version: ${{ (needs.scope.outputs.rust_changed == 'true' || needs.scope.outputs.full_validation == 'true') && 'latest' || '' }}
      node_version: ""
      install_command: ${{ needs.scope.outputs.full_validation == 'true' && 'cd web && bun install --frozen-lockfile' || '' }}
      cache_bun: false
      # Once per job: libudev headers, the asset bundles and cargo-nextest (tests run per process, in parallel).
      apt_packages: ${{ (needs.scope.outputs.rust_changed == 'true' || needs.scope.outputs.full_validation == 'true') && 'libudev-dev' || '' }}
      pre_validate_command: ${{ (needs.scope.outputs.rust_changed == 'true' || needs.scope.outputs.full_validation == 'true') && 'scripts/fetch-bundles.sh && scripts/prepare-ranger-native.sh && curl -LsSf https://get.nexte.st/latest/linux | tar zxf - -C "${CARGO_HOME:-$HOME/.cargo}/bin"' || '' }}
      cache_cargo: ${{ needs.scope.outputs.rust_changed == 'true' || needs.scope.outputs.full_validation == 'true' }}
      format_command: ${{ (needs.scope.outputs.rust_changed == 'true' || needs.scope.outputs.full_validation == 'true') && 'cargo fmt --all -- --check' || '' }}
      lint_command: ${{ needs.scope.outputs.full_validation == 'true' && 'cargo clippy --workspace --all-targets --all-features --locked -- -D warnings && (cd web && bunx --no-install tsc --noEmit -p tsconfig.assets.json)' || '' }}
      # Ordinary Rust PRs run the workspace tests too. GPU tests are #[ignore]d, and the native/Pages
      # reference tests (they build the WASM page with Bun and wasm-bindgen) stay in full validation.
      # The merge-blocking physics backend A/B test (physics-engine #330) needs the test-only
      # `physics-ab` feature; full validation's --all-features run includes it. It runs alongside the
      # workspace suite (it waits for the build lock, then uses the cores the suite's long-tail tests
      # leave idle); either failure fails the step.
      test_command: ${{ needs.scope.outputs.full_validation == 'true' && 'python3 scripts/test-dev-native.py && cargo nextest run --workspace --all-features --locked' || (needs.scope.outputs.rust_changed == 'true' && 'cargo nextest run --workspace --locked -E "not (test(~every_world_prop_region_and_day_phase_matches_pages_submitted_content) | test(~pages_reference_inventory_covers_current_world_scope))" & suite=$!; cargo nextest run -p mmorpg-core --features physics-ab --test physics_ab --locked; wait "$suite"' || '') }}
      build_command: ${{ (needs.scope.outputs.rust_changed == 'true' || needs.scope.outputs.full_validation == 'true') && (needs.scope.outputs.full_validation == 'true' && 'cargo build --workspace --all-features --locked && cargo build -p mmorpg-core -p mmorpg-protocol -p mmorpg-wasm --target wasm32-unknown-unknown --locked' || 'cargo check --workspace --locked') || '' }}

  pages-validation:
    needs: scope
    if: needs.scope.outputs.pages-validation == 'true'
    uses: ./.github/workflows/pages.yml
    with:
      full_validation: ${{ needs.scope.outputs.full_validation == 'true' }}
      browser_evidence: ${{ needs.scope.outputs.browser_evidence == 'true' }}
    secrets: inherit
    permissions:
      contents: read
      pages: write
      id-token: write

  merge-ready:
    name: >-
      ${{ (github.event_name == 'merge_group' || (github.event_name == 'pull_request' &&
      ((github.event.action != 'labeled' && github.event.action != 'unlabeled') ||
      github.event.label.name == 'browser-evidence' || github.event.label.name == 'full-validation'))) &&
      'merge-ready' || 'validation-summary' }}
    if: ${{ always() }}
    needs: [scope, rust, pages-validation]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: moritzbrantner/reusable-workflows/.github/actions/merge-ready@b0f25f241d76af2584dfc9e375084ff5c5cb97da
        with:
          needs: ${{ toJSON(needs) }}
          required: '["scope", "rust", "pages-validation"]'
          allow-skipped: ${{ needs.scope.outputs.allow-skipped || '[]' }}
