# Geometry builders and unit/scenery rigs take positional placement, color and pose arguments
# (up to 12) instead of one-off parameter structs; this matches the existing code style.
too-many-arguments-threshold = 12

# std's transcendental float functions call each platform's C library, which differ in the last
# bit, so native and WASM zone hosts would drift apart (#1109; physics-engine #576). The lint is
# allowed workspace-wide and turned on in the authoritative crates' library code (sim-foundation,
# sim-movement, sim-combat, mmorpg-core), which use the `libm` crate's functions, the same code
# on every target. `sqrt` is IEEE correctly rounded everywhere and stays.
disallowed-methods = [
  { path = "f32::sin", reason = "platform libm: use libm::sinf (#1109)" },
  { path = "f32::cos", reason = "platform libm: use libm::cosf (#1109)" },
  { path = "f32::tan", reason = "platform libm: use libm::tanf (#1109)" },
  { path = "f32::sin_cos", reason = "platform libm: use libm::sincosf (#1109)" },
  { path = "f32::asin", reason = "platform libm: use libm::asinf (#1109)" },
  { path = "f32::acos", reason = "platform libm: use libm::acosf (#1109)" },
  { path = "f32::atan", reason = "platform libm: use libm::atanf (#1109)" },
  { path = "f32::atan2", reason = "platform libm: use libm::atan2f (#1109)" },
  { path = "f32::sinh", reason = "platform libm: use libm::sinhf (#1109)" },
  { path = "f32::cosh", reason = "platform libm: use libm::coshf (#1109)" },
  { path = "f32::tanh", reason = "platform libm: use libm::tanhf (#1109)" },
  { path = "f32::exp", reason = "platform libm: use libm::expf (#1109)" },
  { path = "f32::exp2", reason = "platform libm: use libm::exp2f (#1109)" },
  { path = "f32::exp_m1", reason = "platform libm: use libm::expm1f (#1109)" },
  { path = "f32::ln", reason = "platform libm: use libm::logf (#1109)" },
  { path = "f32::ln_1p", reason = "platform libm: use libm::log1pf (#1109)" },
  { path = "f32::log", reason = "platform libm: use libm::logf ratios (#1109)" },
  { path = "f32::log2", reason = "platform libm: use libm::log2f (#1109)" },
  { path = "f32::log10", reason = "platform libm: use libm::log10f (#1109)" },
  { path = "f32::powf", reason = "platform libm: use libm::powf (#1109)" },
  { path = "f32::powi", reason = "unspecified precision across targets: multiply explicitly (#1109)" },
  { path = "f32::hypot", reason = "platform libm: use libm::hypotf (#1109)" },
  { path = "f32::cbrt", reason = "platform libm: use libm::cbrtf (#1109)" },
  { path = "f64::sin", reason = "platform libm: use libm::sin (#1109)" },
  { path = "f64::cos", reason = "platform libm: use libm::cos (#1109)" },
  { path = "f64::tan", reason = "platform libm: use libm::tan (#1109)" },
  { path = "f64::sin_cos", reason = "platform libm: use libm::sincos (#1109)" },
  { path = "f64::asin", reason = "platform libm: use libm::asin (#1109)" },
  { path = "f64::acos", reason = "platform libm: use libm::acos (#1109)" },
  { path = "f64::atan", reason = "platform libm: use libm::atan (#1109)" },
  { path = "f64::atan2", reason = "platform libm: use libm::atan2 (#1109)" },
  { path = "f64::sinh", reason = "platform libm: use libm::sinh (#1109)" },
  { path = "f64::cosh", reason = "platform libm: use libm::cosh (#1109)" },
  { path = "f64::tanh", reason = "platform libm: use libm::tanh (#1109)" },
  { path = "f64::exp", reason = "platform libm: use libm::exp (#1109)" },
  { path = "f64::exp2", reason = "platform libm: use libm::exp2 (#1109)" },
  { path = "f64::exp_m1", reason = "platform libm: use libm::expm1 (#1109)" },
  { path = "f64::ln", reason = "platform libm: use libm::log (#1109)" },
  { path = "f64::ln_1p", reason = "platform libm: use libm::log1p (#1109)" },
  { path = "f64::log", reason = "platform libm: use libm::log ratios (#1109)" },
  { path = "f64::log2", reason = "platform libm: use libm::log2 (#1109)" },
  { path = "f64::log10", reason = "platform libm: use libm::log10 (#1109)" },
  { path = "f64::powf", reason = "platform libm: use libm::pow (#1109)" },
  { path = "f64::powi", reason = "unspecified precision across targets: multiply explicitly (#1109)" },
  { path = "f64::hypot", reason = "platform libm: use libm::hypot (#1109)" },
  { path = "f64::cbrt", reason = "platform libm: use libm::cbrt (#1109)" },
]
