[workspace]
members = [
  "crates/sim-foundation",
  "crates/sim-movement",
  "crates/sim-combat",
  "crates/mmorpg-core",
  "crates/mmorpg-protocol",
  "crates/mmorpg-game-server",
  "crates/mmorpg-control-plane",
  "crates/mmorpg-characters",
  "crates/mmorpg-postgres",
  "crates/mmorpg-client",
  "crates/mmorpg-scenarios",
  "crates/mmorpg-scenery",
  "crates/mmorpg-presentation",
  "crates/mmorpg-client-model",
  "crates/mmorpg-local-host",
  "crates/mmorpg-wasm",
  "crates/mmorpg-world-studio",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
publish = false

[workspace.dependencies]
game-server = { git = "https://github.com/moritzbrantner/game-server.git", branch = "main" }
rapier3d = "=0.36.1"
physics-engine = { git = "https://github.com/moritzbrantner/physics-engine", branch = "main" }
sim-foundation = { path = "crates/sim-foundation" }
sim-movement = { path = "crates/sim-movement" }
sim-combat = { path = "crates/sim-combat" }
mmorpg-core = { path = "crates/mmorpg-core" }
mmorpg-control-plane = { path = "crates/mmorpg-control-plane" }
mmorpg-characters = { path = "crates/mmorpg-characters" }
mmorpg-postgres = { path = "crates/mmorpg-postgres" }
mmorpg-protocol = { path = "crates/mmorpg-protocol" }
mmorpg-game-server = { path = "crates/mmorpg-game-server" }
mmorpg-scenery = { path = "crates/mmorpg-scenery" }
mmorpg-presentation = { path = "crates/mmorpg-presentation" }
mmorpg-client-model = { path = "crates/mmorpg-client-model" }
mmorpg-local-host = { path = "crates/mmorpg-local-host" }
# The Battle Royale fortress (#552): its one shared arena content, read by the browser's practice
# zone and arena presentation. It names mmorpg-core by git; the patch below points it here.
battle-royale-core = { git = "https://github.com/moenarch-games/battle-royale.git", branch = "main" }
postgres = "=0.19.14"
tokio = { version = "=1.54.1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
# Test-only harness: one trial per workload or scenario file, run in parallel by nextest (#540).
libtest-mimic = "=0.8.2"
# Enum variant lists derived from the enum (#542).
strum = { version = "=0.28.0", features = ["derive"] }
# The same float functions on every target for authoritative code (#1109).
libm = "=0.2.16"

# battle-royale-core builds against this workspace's mmorpg-core, not its own git copy.
[patch."https://github.com/moritzbrantner/mmorpg.git"]
sim-foundation = { path = "crates/sim-foundation" }
sim-movement = { path = "crates/sim-movement" }
sim-combat = { path = "crates/sim-combat" }
mmorpg-core = { path = "crates/mmorpg-core" }

[workspace.lints.rust]
# Libraries forbid unsafe code themselves (`#![forbid(unsafe_code)]`); only the counting
# allocators of the complexity-budget tests (Atlas 7.1.i1055) opt in.
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# clippy.toml lists the platform-libm float functions; only the authoritative crates turn the
# lint on, for their library code (#1109).
disallowed_methods = "allow"

# Dependencies (Rapier, parry, nalgebra, wgpu, ...) are optimized in dev and test builds: the
# deterministic simulation tests and scenarios spend most of their time inside the physics step.
# Workspace crates stay at opt-level 0 in dev builds for fast incremental rebuilds.
[profile.dev.package."*"]
opt-level = 2

# Test builds (cargo test / nextest) also optimize the workspace crates: the zone, quest-chain,
# scenario and physics A/B tests are whole-simulation runs that take minutes at opt-level 0.
# Overflow checks and debug assertions stay on (they follow the dev profile, not opt-level).
# Dependencies keep the dev override above, so test and dev builds share their compiled deps.
[profile.test]
opt-level = 1

# The browser's WASM module (`web/scripts/build-wasm.ts`): whole-program optimised, about a tenth
# less CPU on the browser's world build at load (#855). Native release builds keep the faster
# default release profile.
[profile.wasm-release]
inherits = "release"
lto = "fat"
codegen-units = 1

# The packaged native game (`scripts/run-native.sh`, #1032): whole-program optimised and
# stripped. Slower to build than `release`, which development and tests keep using.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = true
