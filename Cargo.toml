[workspace]
members = [
  "crates/mmorpg-core",
  "crates/mmorpg-protocol",
  "crates/mmorpg-game-server",
  "crates/mmorpg-control-plane",
  "crates/mmorpg-characters",
  "crates/mmorpg-client",
  "crates/mmorpg-scenarios",
  "crates/mmorpg-scenery",
  "crates/mmorpg-presentation",
  "crates/mmorpg-client-model",
  "crates/mmorpg-wasm",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
publish = false

[workspace.dependencies]
game-server = { git = "https://github.com/moritzbrantner/game-server.git", rev = "0d6fbfc7246736f9ff45ab6146e5aa26f671330b" }
rapier3d = "=0.36.1"
physics-engine = { git = "https://github.com/moritzbrantner/physics-engine", rev = "7af1ac43cf63437ba61e543aa4188b36673d5b9f" }
mmorpg-core = { path = "crates/mmorpg-core" }
mmorpg-control-plane = { path = "crates/mmorpg-control-plane" }
mmorpg-characters = { path = "crates/mmorpg-characters" }
mmorpg-protocol = { path = "crates/mmorpg-protocol" }
mmorpg-game-server = { path = "crates/mmorpg-game-server" }
mmorpg-scenery = { path = "crates/mmorpg-scenery" }
mmorpg-presentation = { path = "crates/mmorpg-presentation" }
mmorpg-client-model = { path = "crates/mmorpg-client-model" }
postgres = "=0.19.14"
tokio = { version = "=1.54.1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
# Test-only harness: one trial per workload or scenario file, run in parallel by nextest (#540).
libtest-mimic = "=0.8.2"
# Enum variant lists derived from the enum (#542).
strum = { version = "=0.28.0", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Dependencies (Rapier, parry, nalgebra, wgpu, ...) are optimized in dev and test builds: the
# deterministic simulation tests and scenarios spend most of their time inside the physics step.
# Workspace crates stay at opt-level 0 in dev builds for fast incremental rebuilds.
[profile.dev.package."*"]
opt-level = 2

# Test builds (cargo test / nextest) also optimize the workspace crates: the zone, quest-chain,
# scenario and physics A/B tests are whole-simulation runs that take minutes at opt-level 0.
# Overflow checks and debug assertions stay on (they follow the dev profile, not opt-level).
# Dependencies keep the dev override above, so test and dev builds share their compiled deps.
[profile.test]
opt-level = 1
