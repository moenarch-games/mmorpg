[workspace]
members = [
  "crates/mmorpg-core",
  "crates/mmorpg-protocol",
  "crates/mmorpg-game-server",
  "crates/mmorpg-control-plane",
  "crates/mmorpg-characters",
  "crates/mmorpg-client",
  "crates/mmorpg-scenarios",
  "crates/mmorpg-scenery",
  "crates/mmorpg-presentation",
  "crates/mmorpg-wasm",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
publish = false

[workspace.dependencies]
game-server = { git = "https://github.com/moritzbrantner/game-server.git", rev = "b591a79d0b3e88e6a66b7661464fc8631b843274" }
physics-engine = { git = "https://github.com/moritzbrantner/physics-engine.git", rev = "90f393023d48f36e5e18b9985d046e4e640b705b" }
mmorpg-core = { path = "crates/mmorpg-core" }
mmorpg-control-plane = { path = "crates/mmorpg-control-plane" }
mmorpg-characters = { path = "crates/mmorpg-characters" }
mmorpg-protocol = { path = "crates/mmorpg-protocol" }
mmorpg-game-server = { path = "crates/mmorpg-game-server" }
mmorpg-scenery = { path = "crates/mmorpg-scenery" }
mmorpg-presentation = { path = "crates/mmorpg-presentation" }
tokio = { version = "=1.53.3", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
