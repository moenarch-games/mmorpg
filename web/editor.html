<!doctype html>
<html lang="en">
  <head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Greyhaven layout editor</title></head>
  <body>
    <header><strong>Greyhaven / Outpost</strong><span id="dirty">Saved</span><button id="save">Save to repository & rebuild game</button><button id="reopen">Reopen</button><button id="export">Export JSON</button><label class="button">Import JSON<input id="import" type="file" accept="application/json" hidden></label><a href="./" target="_blank" rel="noopener">Open game ↗</a></header>
    <main>
      <aside><h1>Placements</h1><label>Add prefab<select id="prefab"><option value="lamp">Lamp · decoration</option><option value="signpost">Sign · decoration</option><option value="flowers">Flowers · decoration</option><option value="house">House · collision</option></select></label><button id="add">Add prefab</button><div id="objects" role="listbox" aria-label="Objects"></div><button id="undo">Undo</button><p>Drag to move. Arrow keys: 10 cm; Shift: 1 m. Delete removes the selection.</p></aside>
      <section class="placement"><div class="caption"><strong>Placement · top down</strong><span>North ↑ · 1 grid square = 2 m</span></div><canvas id="map" tabindex="0" aria-label="Top down object placement canvas"></canvas><div id="status" role="status">Loading shared world content…</div></section>
      <section class="details"><div class="caption"><strong>Live game geometry</strong><select id="view" aria-label="Preview camera"><option value="overview">Outpost overview</option><option value="selection">Follow selection</option></select></div><canvas id="preview" aria-label="Live 3D world preview"></canvas><div class="inspector"><h2 id="selection">Select an object</h2><p id="authority"></p><label>X (metres)<input id="x" type="number" step="0.01"></label><label>Z (metres)<input id="z" type="number" step="0.01"></label><label>Yaw (degrees)<input id="yaw" type="number" step="1" min="0" max="359"></label><button id="remove">Remove object</button></div></section>
    </main>
    <script type="module" src="/src/editor/main.ts"></script>
  </body>
</html>
