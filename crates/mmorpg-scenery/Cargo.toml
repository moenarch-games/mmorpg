[package]
name = "mmorpg-scenery"
description = "Presentation-only scenery for shared zone content: props, roads, water, relief and terrain"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Presentation data aligned with core colliders. Clients depend on this crate;
# hosts (mmorpg-game-server and everything below it) never do. See
# mmorpg-game-server/tests/dependency_boundary.rs.
[dependencies]
mmorpg-core.workspace = true
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"

[lints]
workspace = true
