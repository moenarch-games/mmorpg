[package]
name = "mmorpg-game-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Network hosts never depend on presentation data such as mmorpg-scenery;
# tests/dependency_boundary.rs checks the resolved graph.
[dependencies]
game-server.workspace = true
mmorpg-core.workspace = true
mmorpg-characters.workspace = true
mmorpg-control-plane.workspace = true
mmorpg-protocol.workspace = true
tokio.workspace = true

postgres = { workspace = true, optional = true }
serde = { version = "=1.0.229", features = ["derive"], optional = true }
serde_json = { version = "=1.0.154", optional = true }
sha2 = { version = "=0.11.0", optional = true }

[features]
postgres = ["dep:postgres", "dep:serde", "dep:serde_json", "dep:sha2", "mmorpg-characters/postgres"]

[lints]
workspace = true
