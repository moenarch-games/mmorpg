[package]
name = "mmorpg-game-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Network hosts never depend on presentation data such as mmorpg-scenery;
# tests/dependency_boundary.rs checks the resolved graph.
[dependencies]
game-server = { workspace = true, features = ["webrtc-transport"] }
mmorpg-core.workspace = true
mmorpg-characters.workspace = true
mmorpg-control-plane.workspace = true
mmorpg-protocol.workspace = true
tokio.workspace = true
getrandom = "=0.4.3"
ring = "=0.17.14"
url = "=2.5.8"
wtransport = { version = "=0.7.2", default-features = false, features = ["ring", "self-signed"] }

postgres = { workspace = true, optional = true }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.11.1"

object_store = { version = "=0.14.2", default-features = false, features = ["aws"], optional = true }
zstd = { version = "=0.14.3", default-features = false, optional = true }
futures-util = { version = "=0.3.34", optional = true }

[features]
postgres = ["dep:postgres", "mmorpg-characters/postgres", "mmorpg-control-plane/postgres", "dep:object_store", "dep:zstd", "dep:futures-util"]

[dev-dependencies]
tempfile = "=3.27.0"
wtransport = { version = "=0.7.2", default-features = false, features = ["ring", "self-signed"] }

[lints]
workspace = true
