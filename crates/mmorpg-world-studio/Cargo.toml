[package]
name = "mmorpg-world-studio"
description = "Local web app that drives Greyhaven's map, Krita export, paint import and agent reconciliation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Development tooling for this checkout: one program for the web app, capture and import. It reads no
# game crate, and nothing depends on it.

[dependencies]
axum = "=0.8.8"
chromiumoxide = "=0.9.1"
clap = { version = "=4.6.7", features = ["derive"] }
futures-util = "=0.3.34"
image = { version = "=0.25.10", default-features = false, features = ["png"] }
roxmltree = "=0.21.2"
serde ={ version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tokio = { workspace = true, features = ["fs", "process", "time"] }
tower-http = { version = "=0.6.11", features = ["fs"] }
zip = { version = "=9.5.0", default-features = false, features = ["deflate"] }

[lints]
workspace = true
