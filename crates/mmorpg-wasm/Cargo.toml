[package]
name = "mmorpg-wasm"
description = "WebAssembly adapter that runs the shared zone simulation as a local single-player host in the browser demo"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# cdylib for wasm-bindgen, rlib so host-target tests exercise the adapter.
crate-type = ["cdylib", "rlib"]

[dependencies]
strum.workspace = true
mmorpg-characters.workspace = true
mmorpg-core.workspace = true
mmorpg-protocol.workspace = true
# Presentation only: the scenery export and relief queries. The local zone
# host never reads it (checked by a test in src/scenery.rs).
mmorpg-scenery.workspace = true
# Presentation only: the shared static world the browser draws (#184).
mmorpg-presentation.workspace = true
# The client rules the native client shares (#543): HUD, chat, movement outbox, quest views.
mmorpg-client-model.workspace = true
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
# The wire boundary (#541): decoded projections and commands cross as plain JS
# values, and their TypeScript types are generated from the Rust types.
serde-wasm-bindgen = "=0.6.5"
tsify = { version = "=0.5.8", default-features = false, features = ["js"] }
# The web build verifies that the installed wasm-bindgen CLI has this exact version.
wasm-bindgen = "=0.2.129"

[dev-dependencies]
# Parity evidence only: the local host must match the network host's session
# semantics and projection bytes. Never a normal dependency (no tokio in WASM).
game-server.workspace = true
mmorpg-game-server.workspace = true

[lints]
workspace = true
