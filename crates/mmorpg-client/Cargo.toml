[package]
name = "mmorpg-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde_json = "=1.0.154"
gltf = { version = "=1.4.1", default-features = false, features = ["import", "utils", "names"] }
game-server.workspace = true
mmorpg-core.workspace = true
mmorpg-protocol.workspace = true
mmorpg-scenery.workspace = true
tokio.workspace = true
url = "=2.5.8"
wtransport = { version = "=0.7.2", default-features = false, features = ["ring"] }
wgpu = "=30.0.1"
winit = "=0.30.13"
egui = { version = "=0.37.0", default-features = false, features = ["default_fonts"] }
egui-wgpu = { version = "=0.37.0", default-features = false }
egui-winit = { version = "=0.37.0", default-features = false, features = ["x11", "wayland"] }
bytemuck = { version = "=1.25.2", features = ["derive"] }
tobj = { version = "=4.0.5", default-features = false, features = ["use_f64"] }
three-d-core = { git = "https://github.com/moritzbrantner/3d-lab.git", rev = "df52c324a5692d04d2016d8a29f5bc4368e4aac0" }
three-d-camera = { git = "https://github.com/moritzbrantner/3d-lab.git", rev = "df52c324a5692d04d2016d8a29f5bc4368e4aac0" }
three-d-animation = { git = "https://github.com/moritzbrantner/3d-lab.git", rev = "df52c324a5692d04d2016d8a29f5bc4368e4aac0" }
three-d-projective = { git = "https://github.com/moritzbrantner/3d-lab.git", rev = "df52c324a5692d04d2016d8a29f5bc4368e4aac0" }
# gilrs with libudev loaded at runtime (dlopen) instead of linked at build time,
# so the client builds without libudev development headers; API-identical to gilrs 0.11.
gilrs = { package = "gilrs-azul", version = "=0.11.3" }
input-bindings-core = { git = "https://github.com/moritzbrantner/input-bindings.git", rev = "abe258b478c26a27f5139264273c63a7079368b4" }

[dev-dependencies]
mmorpg-wasm = { path = "../mmorpg-wasm" }
tempfile = "=3.27.0"
mmorpg-game-server = { path = "../mmorpg-game-server" }
wtransport = { version = "=0.7.2", default-features = false, features = ["ring", "self-signed", "quinn"] }

[lints]
workspace = true
