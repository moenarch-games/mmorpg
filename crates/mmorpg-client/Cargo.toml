[package]
name = "mmorpg-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
image = { version = "=0.25.10", default-features = false, features = ["png"] }
getrandom = "=0.4.3"
tempfile = "=3.27.0"
serde_json = "=1.0.154"
serde = { version = "=1.0.229", features = ["derive"] }
settings-presentation = { git = "https://github.com/moritzbrantner/settings.git", rev = "e31ec362b6f47eb8dbc70a321a8a633dbd6356ef" }
settings-core = { git = "https://github.com/moritzbrantner/settings.git", rev = "e31ec362b6f47eb8dbc70a321a8a633dbd6356ef" }
gltf = { version = "=1.4.1", default-features = false, features = ["import", "utils", "names"] }
game-server.workspace = true
mmorpg-core.workspace = true
mmorpg-protocol.workspace = true
mmorpg-scenery.workspace = true
mmorpg-presentation.workspace = true
tokio.workspace = true
url = "=2.5.8"
wtransport = { version = "=0.7.2", default-features = false, features = ["ring"] }
wgpu = "=30.0.1"
winit = "=0.30.13"
egui = { version = "=0.37.0", default-features = false, features = ["default_fonts"] }
egui-wgpu = { version = "=0.37.0", default-features = false }
egui-winit = { version = "=0.37.0", default-features = false, features = ["x11", "wayland"] }
bytemuck = { version = "=1.25.2", features = ["derive"] }
tobj = { version = "=4.0.5", default-features = false, features = ["use_f64"] }
three-d-core = { git = "https://github.com/moritzbrantner/3d-lab.git", rev = "c850bda5f37f65f79655469625baf5f1644ac2a0" }
three-d-camera = { git = "https://github.com/moritzbrantner/3d-lab.git", rev = "c850bda5f37f65f79655469625baf5f1644ac2a0" }
three-d-animation = { git = "https://github.com/moritzbrantner/3d-lab.git", rev = "c850bda5f37f65f79655469625baf5f1644ac2a0" }
three-d-projective = { git = "https://github.com/moritzbrantner/3d-lab.git", rev = "c850bda5f37f65f79655469625baf5f1644ac2a0" }
gilrs = "=0.11.2"
input-bindings-core = { git = "https://github.com/moritzbrantner/input-bindings.git", rev = "fb886035c5d64657cf035d84a7b69b371ff4e0d0" }

[build-dependencies]
sha2 = "=0.11.1"
serde_json = "=1.0.154"

[dev-dependencies]
sha2 = "=0.11.1"
mmorpg-wasm = { path = "../mmorpg-wasm" }
mmorpg-game-server = { path = "../mmorpg-game-server" }
wtransport = { version = "=0.7.2", default-features = false, features = ["ring", "self-signed", "quinn"] }

[lints]
workspace = true
