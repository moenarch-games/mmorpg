[package]
name = "mmorpg-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
image = { version = "=0.25.10", default-features = false, features = ["png"] }
getrandom = "=0.4.3"
tempfile = "=3.27.0"
serde_json = "=1.0.154"
serde = { version = "=1.0.229", features = ["derive"] }
settings-presentation = { git = "https://github.com/moritzbrantner/settings.git", rev = "01e8ea5dc682adadb395e46966b4e43dc4edef67" }
settings-core = { git = "https://github.com/moritzbrantner/settings.git", rev = "01e8ea5dc682adadb395e46966b4e43dc4edef67" }
settings-adapters = { git = "https://github.com/moritzbrantner/settings.git", rev = "01e8ea5dc682adadb395e46966b4e43dc4edef67" }
# The shared audio director on kira (#447); Linux builds need ALSA headers (libasound2-dev).
game-audio = { git = "https://github.com/moritzbrantner/game-audio.git", rev = "2643e342a7d071445186e421082acb553141811d", features = ["kira"] }
gltf = { version = "=1.4.1", default-features = false, features = ["import", "utils", "names", "extras"] }
game-server.workspace = true
mmorpg-core.workspace = true
mmorpg-protocol.workspace = true
mmorpg-scenery.workspace = true
mmorpg-presentation.workspace = true
tokio.workspace = true
url = "=2.5.8"
wtransport = { version = "=0.7.2", default-features = false, features = ["ring"] }
wgpu = "=30.0.1"
winit = "=0.30.13"
egui = { version = "=0.37.0", default-features = false, features = ["default_fonts"] }
egui-wgpu = { version = "=0.37.0", default-features = false }
egui-winit = { version = "=0.37.0", default-features = false, features = ["x11", "wayland"] }
bytemuck = { version = "=1.25.2", features = ["derive"] }
tobj = { version = "=4.0.5", default-features = false, features = ["use_f64"] }
three-d-core = { git = "https://github.com/moritzbrantner/3d-lab.git", rev = "77122d13dbd06789dcce05473b0528e61ad69a44" }
three-d-camera = { git = "https://github.com/moritzbrantner/3d-lab.git", rev = "77122d13dbd06789dcce05473b0528e61ad69a44" }
three-d-animation = { git = "https://github.com/moritzbrantner/3d-lab.git", rev = "77122d13dbd06789dcce05473b0528e61ad69a44" }
three-d-projective = { git = "https://github.com/moritzbrantner/3d-lab.git", rev = "77122d13dbd06789dcce05473b0528e61ad69a44" }
gilrs = "=0.11.2"
input-bindings-core = { git = "https://github.com/moritzbrantner/input-bindings.git", rev = "9884cf8c857779d399bc901323d95d42a54022cd" }

[build-dependencies]
sha2 = "=0.11.1"
serde_json = "=1.0.154"

[dev-dependencies]
sha2 = "=0.11.1"
mmorpg-wasm = { path = "../mmorpg-wasm" }
mmorpg-game-server = { path = "../mmorpg-game-server" }
wtransport = { version = "=0.7.2", default-features = false, features = ["ring", "self-signed", "quinn"] }

[lints]
workspace = true
