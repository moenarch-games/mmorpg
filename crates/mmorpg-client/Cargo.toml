[package]
name = "mmorpg-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
strum.workspace = true
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg"] }
# Transcodes the KTX2 (Basis Universal) ground textures (asset-tooling#475); pure Rust.
basisu = "=0.1.0"
getrandom = "=0.4.3"
ring = "=0.17.14"
tempfile = "=3.27.0"
serde_json = "=1.0.154"
sha2 = "=0.11.1"
serde = { version = "=1.0.229", features = ["derive"] }
settings-presentation = { git = "https://github.com/moritzbrantner/settings.git", branch = "main" }
settings-core = { git = "https://github.com/moritzbrantner/settings.git", branch = "main" }
settings-adapters = { git = "https://github.com/moritzbrantner/settings.git", branch = "main" }
# The shared audio director on kira (#447); Linux builds need ALSA headers (libasound2-dev).
game-audio = { git = "https://github.com/moritzbrantner/game-audio.git", branch = "main", features = ["kira"] }
# Decodes the EXT_meshopt_compression views of the Ranger downloads (#866): meshoptimizer's own decoder.
meshopt = "=0.7.0"
gltf = { version = "=1.4.1", default-features = false, features = ["import", "utils", "names", "extras"] }
game-server = { workspace = true, features = ["webrtc-transport"] }
mmorpg-game-server = { path = "../mmorpg-game-server" }
mmorpg-core.workspace = true
mmorpg-protocol.workspace = true
mmorpg-scenery.workspace = true
mmorpg-presentation.workspace = true
mmorpg-client-model.workspace = true
tokio.workspace = true
url = "=2.5.8"
wtransport = { version = "=0.7.2", default-features = false, features = ["ring"] }
wgpu = "=30.0.1"
winit = "=0.30.13"
egui = { version = "=0.37.0", default-features = false, features = ["default_fonts"] }
egui-wgpu = { version = "=0.37.0", default-features = false }
egui-winit = { version = "=0.37.0", default-features = false, features = ["x11", "wayland", "clipboard"] }
bytemuck = { version = "=1.25.2", features = ["derive"] }
tobj = { version = "=4.0.5", default-features = false, features = ["use_f64"] }
# Lighting and rendering (#529): sun/moon, sky, cascaded shadows, sky ambient light, fog and
# point lights, measured against Bevy in its own repository.
render-engine = { git = "https://github.com/moritzbrantner/render-engine.git", branch = "main" }
three-d-core = { git = "https://github.com/moritzbrantner/3d-lab.git", branch = "main" }
three-d-camera = { git = "https://github.com/moritzbrantner/3d-lab.git", branch = "main" }
three-d-animation = { git = "https://github.com/moritzbrantner/3d-lab.git", branch = "main" }
three-d-projective = { git = "https://github.com/moritzbrantner/3d-lab.git", branch = "main" }
gilrs = "=0.11.2"
input-bindings-core = { git = "https://github.com/moritzbrantner/input-bindings.git", branch = "main" }
# The world map (M) is drawn with the Maps library's Rust core: its Web Mercator camera and
# MapLibre line tessellation, and earcut for fills as Maps does (Maps' main, as the browser's maps).
maps-core = { git = "https://github.com/moritzbrantner/maps.git", branch = "main" }
earcut = "=0.4.11"

[build-dependencies]
sha2 = "=0.11.1"
serde_json = "=1.0.154"

[dev-dependencies]
sha2 = "=0.11.1"
mmorpg-wasm = { path = "../mmorpg-wasm" }
wtransport = { version = "=0.7.2", default-features = false, features = ["ring", "self-signed", "quinn"] }

[lints]
workspace = true
