[package]
name = "mmorpg-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
image = { version = "=0.25.10", default-features = false, features = ["png"] }
getrandom = "=0.4.3"
tempfile = "=3.27.0"
serde_json = "=1.0.154"
serde = { version = "=1.0.229", features = ["derive"] }
settings-presentation = { git = "https://github.com/moritzbrantner/settings.git", rev = "38c468c5d1a380416df630d7980be5f0d16631c2" }
settings-core = { git = "https://github.com/moritzbrantner/settings.git", rev = "b441835ac06545f33377399cd537813c343fc20e" }
gltf = { version = "=1.4.1", default-features = false, features = ["import", "utils", "names"] }
game-server.workspace = true
mmorpg-core.workspace = true
mmorpg-protocol.workspace = true
mmorpg-scenery.workspace = true
mmorpg-presentation.workspace = true
tokio.workspace = true
url = "=2.5.8"
wtransport = { version = "=0.7.2", default-features = false, features = ["ring"] }
wgpu = "=30.0.1"
winit = "=0.30.13"
egui = { version = "=0.37.0", default-features = false, features = ["default_fonts"] }
egui-wgpu = { version = "=0.37.0", default-features = false }
egui-winit = { version = "=0.37.0", default-features = false, features = ["x11", "wayland"] }
bytemuck = { version = "=1.25.2", features = ["derive"] }
tobj = { version = "=4.0.5", default-features = false, features = ["use_f64"] }
three-d-core = { git = "https://github.com/moritzbrantner/3d-lab.git", rev = "235774615f1367065093deb6988f5217bdf4d7e1" }
three-d-camera = { git = "https://github.com/moritzbrantner/3d-lab.git", rev = "235774615f1367065093deb6988f5217bdf4d7e1" }
three-d-animation = { git = "https://github.com/moritzbrantner/3d-lab.git", rev = "235774615f1367065093deb6988f5217bdf4d7e1" }
three-d-projective = { git = "https://github.com/moritzbrantner/3d-lab.git", rev = "235774615f1367065093deb6988f5217bdf4d7e1" }
gilrs = "=0.11.2"
input-bindings-core = { git = "https://github.com/moritzbrantner/input-bindings.git", rev = "cf0d89f0cc048cec865682926b15acb1b273e589" }

[build-dependencies]
sha2 = "=0.11.0"
serde_json = "=1.0.154"

[dev-dependencies]
sha2 = "=0.11.0"
mmorpg-wasm = { path = "../mmorpg-wasm" }
mmorpg-game-server = { path = "../mmorpg-game-server" }
wtransport = { version = "=0.7.2", default-features = false, features = ["ring", "self-signed", "quinn"] }

[lints]
workspace = true
