# Kill the existing Greyhaven den wolf through the hosted runtime, then
# reject a stale death, settle once, reject same-tick duplicates and verify
# rewards remain consumed across reconnect and stale connection fencing.
name = "corpse-loot-resume"
zone = 1
ticks = 1125
digest_interval = 100

[[bots]]
name = "hunter"

[[steps]]
tick = 0
bot = "hunter"
action = "join"

# South (+Z) onto the Wolfrun Trail's hub segment.
[[steps]]
tick = 0
bot = "hunter"
action = "move"
forward = 1
strafe = 0
facing = 0

# Attacking without a target is refused with an event, not a session error.
[[steps]]
tick = 1
bot = "hunter"
action = "start_attack"

# West along the trail, through the west gate.
[[steps]]
tick = 36
bot = "hunter"
action = "move"
forward = 1
strafe = 0
facing = 49152

# Outside the palisade, step north onto the trunk-grid line z = 1800 …
[[steps]]
tick = 121
bot = "hunter"
action = "move"
forward = 1
strafe = 0
facing = 32768

# … and follow it west into Wolfrun Woods.
[[steps]]
tick = 131
bot = "hunter"
action = "move"
forward = 1
strafe = 0
facing = 49152

# North along the trunk-grid line x = -8450 toward the den clearing.
[[steps]]
tick = 375
bot = "hunter"
action = "move"
forward = 1
strafe = 0
facing = 32768

# Select the den wolf while approaching; it is still beyond melee reach.
