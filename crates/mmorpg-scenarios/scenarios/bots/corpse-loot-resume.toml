# Kill the existing Greyhaven den wolf through the hosted runtime, then
# reject a stale death, settle once, reject same-tick duplicates and verify
# rewards remain consumed across reconnect and stale connection fencing.
name = "corpse-loot-resume"
zone = 1
ticks = 2811
digest_interval = 200

[[bots]]
name = "hunter"

[[steps]]
tick = 0
bot = "hunter"
action = "join"

# South (+Z) onto the Wolfrun Trail's hub segment.
[[steps]]
tick = 0
bot = "hunter"
action = "move"
forward = 1
strafe = 0
facing = 0

# A swing at nothing whiffs: an event, not a session error.
[[steps]]
tick = 2
bot = "hunter"
action = "swing"
facing = 0

# West along the trail, over the mill bank crossing at z = 2140 cm.
[[steps]]
tick = 85
bot = "hunter"
action = "move"
forward = 1
strafe = 0
facing = 49152

# At the foot of the woods' cliff, north up the Wolfrun Climb's ledge (#423) …
[[steps]]
tick = 337
bot = "hunter"
action = "move"
forward = 1
strafe = 0
facing = 32768

# … west across the hairpin landing …
[[steps]]
tick = 712
bot = "hunter"
action = "move"
forward = 1
strafe = 0
facing = 49152

# … south up the cutting into the woods …
[[steps]]
tick = 826
bot = "hunter"
action = "move"
forward = 1
strafe = 0
facing = 0

# … and west along the trunk-grid line z = 1800 into Wolfrun Woods.
[[steps]]
tick = 1156
bot = "hunter"
action = "move"
forward = 1
strafe = 0
facing = 49152

# North along the trunk-grid line x = -8450 toward the den clearing.
[[steps]]
tick = 1460
bot = "hunter"
action = "move"
forward = 1
strafe = 0
facing = 32768

# Select the den wolf while approaching; it is still beyond melee reach.
[[steps]]
tick = 1470
bot = "hunter"
action = "select_target"
entity = "creature:108"

# Stand close enough to the den that Wolf 108 engages wherever it wanders, and let it come.
[[steps]]
tick = 1540
bot = "hunter"
action = "move"
forward = 0
strafe = 0
facing = 32768

# Keep pressing attack at the wolf (#517), aimed where the hunter sees it.
[[steps]]
tick = 1540
bot = "hunter"
action = "swing"
entity = "creature:108"
until = 2760
# Pressing faster than any wind-up keeps a press waiting at each contact, so no follow-up
# window opens (#928) and every strike begins as soon as its recovery allows.
every = 10

# A step in toward the wolf (#1249) ends with the swinging: the hunter stands by its corpse.
