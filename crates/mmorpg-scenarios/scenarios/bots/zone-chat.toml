# Say and yell lines travel through real sessions: /say reaches 20 m and
# /yell 60 m around the speaker, speakers hear themselves, and a speaker
# may speak once per second.
name = "zone-chat"
zone = 1
ticks = 420
reconnect_grace_ticks = 60
digest_interval = 60

[[bots]]
name = "alice"

[[bots]]
name = "bob"

[[bots]]
name = "carol"

[[steps]]
tick = 0
bot = "alice"
action = "join"

[[steps]]
tick = 0
bot = "bob"
action = "join"

[[steps]]
tick = 0
bot = "carol"
action = "join"

# Carol runs about 30 m east along the plaza: beyond /say, within /yell.
[[steps]]
tick = 2
bot = "carol"
action = "move"
forward = 1
strafe = 0
facing = 16384

[[steps]]
tick = 288
bot = "carol"
action = "move"
forward = 0
strafe = 0
facing = 16384

[[steps]]
tick = 320
bot = "alice"
action = "chat"
channel = "say"
text = "Hail, Greyhaven!"

[[steps]]
tick = 322
bot = "alice"
action = "chat"
channel = "say"
text = "Too soon"

[[steps]]
tick = 360
bot = "bob"
action = "chat"
channel = "yell"
text = "Wolves at the gate!"

[[steps]]
tick = 390
bot = "alice"
action = "chat"
channel = "say"
text = "Coming!"

