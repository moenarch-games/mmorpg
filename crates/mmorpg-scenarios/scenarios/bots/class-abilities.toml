# Classes and abilities through the hosted runtime. A Warden, a Ranger and an
# Arcanist choose their classes in the hub, are refused abilities they cannot
# use yet, and walk in a column along the vale-wolf-hunt route (each bot five
# ticks behind the one ahead, so all three keep to the clear trunk-grid
# lines) into Wolfrun Woods. Timber Wolf 108 engages the Warden at the front.
# The Warden auto-attacks and builds rage, the Ranger opens with Aimed Shot
# and the Arcanist casts Firebolt; the global cooldown, the Aimed Shot
# cooldown, an overlapping cast, a movement interrupt and a cancelled cast are
# refused or reported as events. Every command step is applied.
name = "class-abilities"
zone = 1
ticks = 900
digest_interval = 100

[[bots]]
name = "warden"

[[bots]]
name = "ranger"

[[bots]]
name = "arcanist"

[[steps]]
tick = 0
bot = "warden"
action = "join"

[[steps]]
tick = 0
bot = "ranger"
action = "join"

[[steps]]
tick = 0
bot = "arcanist"
action = "join"

