# The Warden's shield guard through the hosted runtime (#156). A Warden walks
# the vale-wolf-hunt route to Timber Wolf 108 and stands facing it with a
# middle guard: the wolf's middle-height bites are blocked. Guarding high, the
# wrong lane, lets them through again; lowering the guard is applied.
name = "warden-guard"
zone = 1
ticks = 1400
digest_interval = 200

