# Bag moves pass through real sessions; loss recovery is periodic self state.
name = "inventory-resume"
zone = 1
ticks = 22
reconnect_grace_ticks = 30
digest_interval = 10

[[bots]]
name = "alice"

[[bots]]
name = "bob"

[[steps]]
tick = 0
bot = "alice"
action = "join"

[[steps]]
tick = 0
bot = "bob"
action = "join"

[[steps]]
tick = 0
bot = "alice"
action = "move_item"
source_slot = 0
destination_slot = 15
quantity = 2
seq = 1

[[steps]]
tick = 1
bot = "alice"
action = "move_item"
source_slot = 15
destination_slot = 1
quantity = 1
seq = 2

[[steps]]
tick = 2
bot = "alice"
action = "move_item"
source_slot = 15
destination_slot = 0
quantity = 2
seq = 1
expect = "ignored_stale"

[[steps]]
tick = 3
bot = "alice"
action = "disconnect"

[[steps]]
tick = 5
bot = "alice"
action = "reconnect"

[[steps]]
tick = 10
bot = "alice"
action = "move_item"
source_slot = 15
destination_slot = 0
quantity = 2
seq = 3
connection_epoch = 1
expect = "rejected:stale_connection"

[[steps]]
tick = 10
bot = "alice"
action = "move_item"
source_slot = 15
destination_slot = 0
quantity = 2
seq = 3

[[steps]]
