bot = "alice"
action = "move_item"
source_slot = 0
destination_slot = 15
quantity = 3
seq = 3
expect = "ignored_stale"

[[expect]]
kind = "inventory"
bot = "alice"
tick = 1
inventory_revision = 2
sheet = true
slot = 15
item = 1
quantity = 2

[[expect]]
kind = "inventory"
bot = "alice"
tick = 1
inventory_revision = 2
sheet = true
slot = 0
item = 1
quantity = 1

[[expect]]
