# Greyhaven Vale combat through the hosted runtime. A hunter leaves the hub
# over the mill bank crossing, climbs the Wolfrun Climb (#423) and walks Wolfrun Woods
# along trunk-grid lines, which stay clear of trunks. Timber Wolf 108 in the
# den clearing notices it; the hunter targets it and keeps swinging at it (#517)
# until it dies. Wounded, the hunter walks on until Timber Wolf 106 engages,
# swings at it for a while, stops and dies. The wolf, left without
# threat, evades home, and the
# released spirit returns to the graveyard with half health and stands there:
# movement sent while dead holds no intent. Refused intents are gameplay
# events; every command step is applied.
name = "vale-wolf-hunt"
zone = 1
ticks = 5208
digest_interval = 200

[[bots]]
name = "hunter"

[[steps]]
tick = 0
bot = "hunter"
action = "join"

# South (+Z) onto the Wolfrun Trail's hub segment.
[[steps]]
tick = 0
bot = "hunter"
action = "move"
forward = 1
strafe = 0
facing = 0

# A swing at nothing whiffs: an event, not a session error.
[[steps]]
tick = 2
bot = "hunter"
action = "swing"
facing = 0

# West along the trail, over the mill bank crossing at z = 2140 cm.
[[steps]]
tick = 85
bot = "hunter"
action = "move"
forward = 1
strafe = 0
facing = 49152

# Follow the western stone apron south before leaving the raised towpath.
[[steps]]
tick = 262
bot = "hunter"
action = "move"
forward = 1
strafe = 0
facing = 0

[[steps]]
tick = 291
bot = "hunter"
action = "move"
forward = 1
strafe = 0
facing = 49152

# At the foot of the woods' cliff, north up the Wolfrun Climb's ledge (#423) …
[[steps]]
tick = 366
bot = "hunter"
action = "move"
forward = 1
strafe = 0
facing = 32768

# … west across the hairpin landing (after the extra northward approach) …
[[steps]]
tick = 770
bot = "hunter"
action = "move"
forward = 1
strafe = 0
facing = 49152

# … south up the cutting into the woods …
[[steps]]
tick = 884
bot = "hunter"
