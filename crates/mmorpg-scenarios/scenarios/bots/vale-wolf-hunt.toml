# Greyhaven Vale combat through the hosted runtime. A hunter leaves the hub
# through the west gate, climbs the Wolfrun Climb (#423) and walks Wolfrun Woods
# along trunk-grid lines, which stay clear of trunks. Timber Wolf 108 in the
# den clearing notices it; the hunter targets and auto-attacks it to death, and
# the corpse refuses further attacks. Wounded, the hunter walks on until
# Timber Wolf 106 engages, stops attacking and dies. The wolf, left without
# threat, evades home, and the
# released spirit returns to the graveyard with half health and stands there:
# movement sent while dead holds no intent. Refused intents are gameplay
# events; every command step is applied.
name = "vale-wolf-hunt"
zone = 1
ticks = 5124
digest_interval = 200

[[bots]]
name = "hunter"

[[steps]]
tick = 0
bot = "hunter"
action = "join"

# South (+Z) onto the Wolfrun Trail's hub segment.
[[steps]]
tick = 0
bot = "hunter"
action = "move"
forward = 1
strafe = 0
facing = 0

# Attacking without a target is refused with an event, not a session error.
[[steps]]
tick = 2
bot = "hunter"
action = "start_attack"

# West along the trail, through the west gate.
[[steps]]
tick = 72
bot = "hunter"
action = "move"
forward = 1
strafe = 0
facing = 49152

# At the foot of the woods' cliff, north up the Wolfrun Climb's ledge (#423) …
[[steps]]
tick = 324
bot = "hunter"
action = "move"
forward = 1
strafe = 0
facing = 32768

# … west across the hairpin landing …
[[steps]]
tick = 686
bot = "hunter"
action = "move"
forward = 1
strafe = 0
facing = 49152

# … south up the cutting into the woods …
[[steps]]
tick = 800
bot = "hunter"
action = "move"
forward = 1
strafe = 0
facing = 0

# … and west along the trunk-grid line z = 1800 into Wolfrun Woods.
[[steps]]
tick = 1130
bot = "hunter"
action = "move"
forward = 1
strafe = 0
facing = 49152

# North along the trunk-grid line x = -8450 toward the den clearing.
[[steps]]
tick = 1434
bot = "hunter"
action = "move"
forward = 1
strafe = 0
facing = 32768

# Select the den wolf while approaching; it is still beyond melee reach.
[[steps]]
tick = 1444
bot = "hunter"
action = "select_target"
entity = "creature:108"

[[steps]]
tick = 1444
bot = "hunter"
action = "start_attack"

# Stand close enough to the den that Wolf 108 engages wherever it wanders, and let it come.
[[steps]]
tick = 1514
bot = "hunter"
action = "move"
forward = 0
strafe = 0
facing = 32768

# The corpse cannot be attacked.
[[steps]]
tick = 2964
bot = "hunter"
action = "start_attack"

# Wounded, walk on north-west through the clearing toward Wolf 106's den.
[[steps]]
tick = 2984
bot = "hunter"
action = "move"
forward = 1
strafe = 0
facing = 37400

# Stand once near Wolf 106, target it and fight back as it engages …
[[steps]]
tick = 3224
bot = "hunter"
action = "move"
forward = 0
strafe = 0
facing = 32768

[[steps]]
tick = 3224
bot = "hunter"
action = "select_target"
entity = "creature:106"

[[steps]]
tick = 3224
bot = "hunter"
action = "start_attack"

# … then stop swinging and keep the selection.
[[steps]]
tick = 3524
bot = "hunter"
action = "stop_attack"

# The dead can neither attack nor move: the walk is accepted but holds
# nothing, so the released spirit stands at the graveyard.
[[steps]]
tick = 4524
bot = "hunter"
action = "start_attack"

[[steps]]
tick = 4524
bot = "hunter"
action = "move"
forward = 1
strafe = 0
facing = 0

[[steps]]
tick = 4924
bot = "hunter"
action = "release_spirit"

