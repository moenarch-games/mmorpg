forward = 1
strafe = 0
facing = 0

# … and west along the trunk-grid line z = 1800 into Wolfrun Woods.
[[steps]]
tick = 1214
bot = "hunter"
action = "move"
forward = 1
strafe = 0
facing = 49152

# North along the trunk-grid line x = -8450 toward the den clearing.
[[steps]]
tick = 1518
bot = "hunter"
action = "move"
forward = 1
strafe = 0
facing = 32768

# Select the den wolf while approaching; it is still beyond melee reach.
[[steps]]
tick = 1528
bot = "hunter"
action = "select_target"
entity = "creature:108"

# Stand close enough to the den that Wolf 108 engages wherever it wanders, and let it come.
[[steps]]
tick = 1598
bot = "hunter"
action = "move"
forward = 0
strafe = 0
facing = 32768

# Keep pressing attack at the wolf, aimed where the hunter sees it.
[[steps]]
tick = 1628
bot = "hunter"
action = "swing"
entity = "creature:108"
until = 2964
every = 30

# Wounded, walk on north-west through the clearing toward Wolf 106's den.
[[steps]]
tick = 3068
bot = "hunter"
action = "move"
forward = 1
strafe = 0
facing = 37400

# Stand once near Wolf 106, target it and fight back as it engages …
[[steps]]
tick = 3308
bot = "hunter"
action = "move"
forward = 0
strafe = 0
facing = 32768

[[steps]]
tick = 3308
bot = "hunter"
action = "select_target"
entity = "creature:106"

# … swing at it, then stop swinging and keep the selection.
[[steps]]
tick = 3308
bot = "hunter"
action = "swing"
entity = "creature:106"
until = 3524
every = 30

# The dead can neither swing nor move: the walk is accepted but holds
# nothing, so the released spirit stands at the graveyard.
[[steps]]
tick = 4608
bot = "hunter"
action = "swing"
facing = 0

[[steps]]
tick = 4608
bot = "hunter"
action = "move"
forward = 1
strafe = 0
facing = 0

[[steps]]
tick = 5008
bot = "hunter"
action = "release_spirit"

