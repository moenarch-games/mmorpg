# Greyhaven Vale combat through the hosted runtime. A hunter leaves the hub
# through the west gate, climbs the Wolfrun Climb (#423) and walks Wolfrun Woods
# along trunk-grid lines, which stay clear of trunks. Timber Wolf 108 in the
# den clearing notices it; the hunter targets it and keeps swinging at it (#517)
# until it dies. Wounded, the hunter walks on until Timber Wolf 106 engages,
# swings at it for a while, stops and dies. The wolf, left without
# threat, evades home, and the
# released spirit returns to the graveyard with half health and stands there:
# movement sent while dead holds no intent. Refused intents are gameplay
# events; every command step is applied.
name = "vale-wolf-hunt"
zone = 1
ticks = 5124
digest_interval = 200

[[bots]]
name = "hunter"

[[steps]]
tick = 0
bot = "hunter"
action = "join"

# South (+Z) onto the Wolfrun Trail's hub segment.
[[steps]]
tick = 0
bot = "hunter"
action = "move"
forward = 1
strafe = 0
facing = 0

# A swing at nothing whiffs: an event, not a session error.
[[steps]]
tick = 2
bot = "hunter"
action = "swing"
facing = 0

# West along the trail, through the west gate.
[[steps]]
tick = 72
bot = "hunter"
action = "move"
forward = 1
strafe = 0
facing = 49152

# At the foot of the woods' cliff, north up the Wolfrun Climb's ledge (#423) …
[[steps]]
tick = 324
bot = "hunter"
action = "move"
forward = 1
strafe = 0
facing = 32768

# … west across the hairpin landing …
[[steps]]
tick = 686
bot = "hunter"
action = "move"
forward = 1
strafe = 0
facing = 49152

# … south up the cutting into the woods …
[[steps]]
tick = 800
bot = "hunter"
action = "move"
forward = 1
strafe = 0
facing = 0

# … and west along the trunk-grid line z = 1800 into Wolfrun Woods.
[[steps]]
tick = 1130
bot = "hunter"
action = "move"
forward = 1
strafe = 0
facing = 49152

# North along the trunk-grid line x = -8450 toward the den clearing.
[[steps]]
tick = 1434
bot = "hunter"
action = "move"
forward = 1
strafe = 0
facing = 32768

# Select the den wolf while approaching; it is still beyond melee reach.
[[steps]]
tick = 1444
bot = "hunter"
action = "select_target"
entity = "creature:108"

# Stand close enough to the den that Wolf 108 engages wherever it wanders, and let it come.
[[steps]]
tick = 1514
bot = "hunter"
action = "move"
forward = 0
strafe = 0
facing = 32768

# Keep pressing attack at the wolf, aimed where the hunter sees it.
[[steps]]
tick = 1514
bot = "hunter"
action = "swing"
entity = "creature:108"
until = 2964
every = 20

# Wounded, walk on north-west through the clearing toward Wolf 106's den.
[[steps]]
tick = 2984
bot = "hunter"
action = "move"
forward = 1
strafe = 0
facing = 37400

# Stand once near Wolf 106, target it and fight back as it engages …
[[steps]]
tick = 3224
bot = "hunter"
action = "move"
forward = 0
strafe = 0
facing = 32768

[[steps]]
tick = 3224
bot = "hunter"
action = "select_target"
entity = "creature:106"

# … swing at it, then stop swinging and keep the selection.
[[steps]]
tick = 3224
bot = "hunter"
action = "swing"
entity = "creature:106"
until = 3524
every = 20

# The dead can neither swing nor move: the walk is accepted but holds
# nothing, so the released spirit stands at the graveyard.
[[steps]]
tick = 4524
bot = "hunter"
action = "swing"
facing = 0

[[steps]]
tick = 4524
bot = "hunter"
action = "move"
forward = 1
strafe = 0
facing = 0

[[steps]]
tick = 4924
bot = "hunter"
action = "release_spirit"

