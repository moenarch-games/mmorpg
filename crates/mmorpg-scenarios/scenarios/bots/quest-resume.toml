# Accepting, refusing, abandoning and re-accepting Trouble in the Woods at
# Marshal Elden Greywatch (NPC 1) pass through real sessions: quests need
# the giver within 5 m and an unlocked quest, the Marshal's marker follows
# the log, and the log survives a connection resume.
name = "quest-resume"
zone = 1
ticks = 120
reconnect_grace_ticks = 60
digest_interval = 40

[[bots]]
name = "alice"

[[steps]]
tick = 0
bot = "alice"
action = "join"

# From spawn slot 0 the Marshal stands about 7 m away.
[[steps]]
tick = 2
bot = "alice"
action = "accept_quest"
npc = 1
quest = 1

# Run west along the plaza's northern edge to 3.5 m from the Marshal.
[[steps]]
tick = 4
bot = "alice"
action = "move"
forward = 1
strafe = 0
facing = 49152

[[steps]]
tick = 64
bot = "alice"
action = "move"
forward = 0
strafe = 0
facing = 49152

# Pelts for the Tanner needs Trouble in the Woods turned in, and the
# Tanner gives it, not the Marshal.
[[steps]]
tick = 68
bot = "alice"
action = "accept_quest"
npc = 1
quest = 2

[[steps]]
tick = 70
bot = "alice"
action = "accept_quest"
npc = 1
quest = 1

# No wolf has died yet.
[[steps]]
tick = 72
bot = "alice"
action = "complete_quest"
npc = 1
quest = 1
choice = 0

[[steps]]
tick = 74
bot = "alice"
action = "abandon_quest"
quest = 1

[[steps]]
tick = 76
bot = "alice"
action = "accept_quest"
npc = 1
quest = 1

[[steps]]
tick = 80
bot = "alice"
action = "disconnect"

[[steps]]
tick = 84
bot = "alice"
action = "reconnect"

[[expect]]
kind = "event"
bot = "alice"
tick = 3
event = "error:out_of_range"

# Quest sheets arrive on change ticks and every ten ticks.
[[expect]]
kind = "marker"
bot = "alice"
tick = 20
npc = 1
marker = "available"

[[expect]]
kind = "marker"
bot = "alice"
tick = 20
npc = 2
marker = "none"

[[expect]]
kind = "position"
bot = "alice"
tick = 66
position = [-2180, 90, 1250]

[[expect]]
kind = "event"
bot = "alice"
tick = 69
event = "error:invalid_quest"

[[expect]]
kind = "quest"
bot = "alice"
tick = 71
quest = 1
quest_state = "active"
progress = [0, 0, 0]

[[expect]]
kind = "marker"
bot = "alice"
tick = 71
npc = 1
marker = "in_progress"

[[expect]]
kind = "event"
bot = "alice"
tick = 73
event = "error:quest_incomplete"

[[expect]]
kind = "quest"
bot = "alice"
tick = 75
quest = 1
quest_state = "absent"

[[expect]]
kind = "marker"
bot = "alice"
tick = 75
npc = 1
marker = "available"

[[expect]]
kind = "quest"
bot = "alice"
tick = 77
quest = 1
quest_state = "active"
progress = [0, 0, 0]

[[expect]]
kind = "identity"
bot = "alice"
tick = 85

[[expect]]
kind = "quest"
bot = "alice"
tick = 99
quest = 1
quest_state = "active"
progress = [0, 0, 0]
