# Two bots join the Greyhaven Outpost plaza, see each other at spawn and run
# on paths that never touch: alice faces +Z (facing 0), bob faces +X (facing
# 16384). Spawn slots 0 and 1 stand at (-1550, 1250) and (-1450, 1250).
# Positions come from the real physics step and are checked exactly.
name = "two-bots-move"
zone = 1
ticks = 20

[[bots]]
name = "alice"

[[bots]]
name = "bob"

[[steps]]
tick = 0
bot = "alice"
action = "join"

[[steps]]
tick = 0
bot = "bob"
action = "join"

[[steps]]
tick = 0
bot = "alice"
action = "move"
forward = 1
strafe = 0
facing = 0

[[steps]]
tick = 10
bot = "bob"
action = "move"
forward = 1
strafe = 0
facing = 16384

[[expect]]
kind = "sees"
bot = "alice"
target = "bob"
tick = 1

[[expect]]
kind = "sees"
bot = "bob"
target = "alice"
tick = 1

[[expect]]
kind = "acknowledged"
bot = "alice"
tick = 1
sequence = 1

[[expect]]
kind = "position"
bot = "bob"
target = "alice"
tick = 20
position = [-1550, 90, 1460]

[[expect]]
kind = "position"
bot = "alice"
target = "bob"
tick = 20
position = [-1345, 90, 1250]
