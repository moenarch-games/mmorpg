# Selling to and buying from Innkeeper Bram Tolliver (NPC 3) inside the inn
# pass through real sessions: the inn door opens only within reach, trades
# need reach and copper, settle bag and copper together, and survive a
# connection resume.
name = "vendor-resume"
zone = 1
ticks = 560
reconnect_grace_ticks = 60
digest_interval = 50

[[bots]]
name = "alice"

[[steps]]
tick = 0
bot = "alice"
action = "join"

# From the spawn plaza the vendor is about 30 m away.
[[steps]]
tick = 2
bot = "alice"
action = "sell_item"
npc = 3
bag_slot = 0
quantity = 1

# The inn door is out of reach from the plaza.
[[steps]]
tick = 6
bot = "alice"
action = "use_door"
door = 1
open = true

# Run east along the plaza, then north to the inn's front door.
