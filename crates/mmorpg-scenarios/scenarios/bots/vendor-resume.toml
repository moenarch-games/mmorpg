# Selling to and buying from Innkeeper Bram Tolliver (NPC 3) pass through
# real sessions: trades need reach and copper, settle bag and copper
# together, and survive a connection resume.
name = "vendor-resume"
zone = 1
ticks = 175
reconnect_grace_ticks = 30
digest_interval = 25

[[bots]]
name = "alice"

