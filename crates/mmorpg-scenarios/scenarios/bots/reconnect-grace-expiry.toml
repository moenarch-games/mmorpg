# A bot that stays disconnected past the reconnect grace period is removed
# from the zone: other bots stop seeing it and a late resume fails closed
# instead of creating a new player.
name = "reconnect-grace-expiry"
zone = 1
ticks = 20
reconnect_grace_ticks = 6

[[bots]]
name = "alice"

[[bots]]
name = "bob"

[[steps]]
tick = 0
bot = "alice"
action = "join"

[[steps]]
tick = 0
bot = "bob"
action = "join"

[[steps]]
tick = 2
bot = "alice"
action = "disconnect"

[[steps]]
tick = 16
bot = "alice"
action = "reconnect"
expect = "rejected:unknown_token"

[[expect]]
kind = "sees"
bot = "bob"
target = "alice"
tick = 7

[[expect]]
kind = "not_sees"
bot = "bob"
target = "alice"
tick = 11

[[expect]]
kind = "visible_count"
bot = "bob"
tick = 19
count = 1
