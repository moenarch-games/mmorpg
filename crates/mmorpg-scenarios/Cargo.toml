[package]
name = "mmorpg-scenarios"
description = "Deterministic headless scenario runners for bots and the control-plane reference model"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "mmorpg-scenario"
path = "src/main.rs"

[dependencies]
game-server.workspace = true
mmorpg-core.workspace = true
mmorpg-protocol.workspace = true
mmorpg-game-server.workspace = true
mmorpg-control-plane.workspace = true
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
toml = { version = "=1.1.8", default-features = false, features = ["parse", "serde", "std"] }

[dev-dependencies]
libtest-mimic.workspace = true

# One trial per checked-in bot scenario, so nextest runs them in parallel (#540).
[[test]]
name = "bot_scenarios"
harness = false

[lints]
workspace = true
