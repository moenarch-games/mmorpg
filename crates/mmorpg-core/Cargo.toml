[package]
name = "mmorpg-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
sim-foundation.workspace = true
strum.workspace = true
rapier3d = { workspace = true, optional = true }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
# Diagnostic timing also runs in the real WASM acceptance harness.
web-time = { version = "=1.1.0", optional = true }

[features]
# Enables the independent Rapier oracle and A/B timing/operation diagnostics.
physics-ab = ["sim-foundation/physics-ab", "dep:rapier3d", "dep:web-time"]

[dev-dependencies]
# The authored-backend A/B test drives the production engine directly.
physics-engine.workspace = true
# Reads the bot scenario files the physics A/B test replays.
toml = { version = "=1.2.0", default-features = false, features = ["parse", "serde", "std"] }
libtest-mimic.workspace = true
wasm-bindgen = "=0.2.129"

# One trial per workload, so nextest runs them in parallel (#540).
[[test]]
name = "physics_ab"
required-features = ["physics-ab"]
harness = false

[[example]]
name = "physics_ab"
required-features = ["physics-ab"]

[lints]
workspace = true

# Shares every native assertion and fixture; no production browser API.
[[example]]
name = "physics_ab_wasm"
crate-type = ["cdylib"]
required-features = ["physics-ab"]

[[test]]
name = "authored_backend"
required-features = ["physics-ab"]
