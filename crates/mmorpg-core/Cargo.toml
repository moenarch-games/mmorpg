[package]
name = "mmorpg-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
strum.workspace = true
rapier3d.workspace = true
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
# Primary backend for supported content; Rapier remains the compatibility fallback and oracle.
physics-engine.workspace = true

[features]
# Extra A/B timing/operation diagnostics and oracle comparisons.
physics-ab = []

[dev-dependencies]
# Reads the bot scenario files the physics A/B test replays.
toml = { version = "=1.2.0", default-features = false, features = ["parse", "serde", "std"] }
libtest-mimic.workspace = true

# One trial per workload, so nextest runs them in parallel (#540).
[[test]]
name = "physics_ab"
required-features = ["physics-ab"]
harness = false

[[example]]
name = "physics_ab"
required-features = ["physics-ab"]

[lints]
workspace = true
